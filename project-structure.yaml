# Project Structure for RAG Report System
project_name: RAG_Report
version: 1.0.0
description: Hệ thống RAG sinh báo cáo tài chính sử dụng FPT Cloud Embedding & Reranker và LangGraph.

structure:
  .agents:
    description: Quy tắc và workflow dành cho AI agent
    children:
      rules:
        description: Quy tắc phát triển và debug dự án
      workflows:
        description: Hướng dẫn workflow
  data:
    description: Thư mục chứa dữ liệu đầu vào và kết quả đầu ra
    children:
      A32:
        description: Dữ liệu tài chính Công ty CP 32 qua các năm
        children:
          2017:
            description: Báo cáo tài chính năm 2017
          2018:
            description: Báo cáo tài chính năm 2018
          2019:
            description: Báo cáo tài chính năm 2019
          2020:
            description: Báo cáo tài chính năm 2020
          2021:
            description: Báo cáo tài chính năm 2021
          2023:
            description: Báo cáo tài chính năm 2023
          2024:
            description: Báo cáo tài chính năm 2024
          2025:
            description: Báo cáo tài chính năm 2025
          question_eval.json:
            description: Bộ câu hỏi kiểm thử hệ thống RAG gồm 60 mẫu với đầy đủ trường Source và Page position.
      processed:
        description: Dữ liệu tài chính trung gian được trích xuất (DuckDB, JSON và cấu hình chart)
      reports:
        description: Thư mục lưu trữ báo cáo HTML được kết xuất
        children:
          A32_Financial_Report.html:
            description: Báo cáo tài chính HTML chính thức phiên bản v1
          A32_Financial_Report_v2.html:
            description: Báo cáo tài chính HTML phiên bản v2 (RAG mode, rerank_top_n=10) để so sánh với v1
  plan:
    description: Các Spec triển khai và kế hoạch thiết kế
    children:
      IMPLEMENTATION_SPEC_RAG_REPORT.md:
        description: Hướng dẫn đặc tả kiến trúc RAG Report gốc
  src:
    description: Mã nguồn hệ thống RAG Report
    children:
      rag_report:
        description: Module chính của hệ thống RAG
        children:
          config:
            description: Cấu hình và logging
          schemas:
            description: Các Pydantic schemas định hình dữ liệu
          ingestion:
            description: Phân tích tài liệu, nhúng vector và đồng bộ DB/Qdrant
          query:
            description: Hệ thống LangGraph RAG truy vấn dữ liệu với cơ chế từ chối trả lời (Abstention)
          evaluation:
            description: Hệ thống đánh giá tự động (RAG Triad & Ground Truth) sử dụng Ragas
          exporter:
            description: Trích xuất biểu đồ Altair và kết xuất báo cáo tài chính HTML
  flows:
    description: Prefect flows để điều phối pipeline chạy định kỳ
    children:
      prefect_ingestion_flow.py:
        description: Pipeline hoàn chỉnh chạy nạp tài liệu
      generate_report_flow.py:
        description: Pipeline tạo biểu đồ, truy vấn RAG và kết xuất báo cáo HTML
  tests:
    description: Các script smoke test kiểm thử hoạt động API và từng component độc lập
    children:
      run_generate_v2.py:
        description: Script sinh báo cáo phiên bản v2 với RAG mode (lưu riêng không ghi đè v1)
      smoke_test_evaluator.py:
        description: Smoke test cho hệ thống đánh giá tự động (RAG Evaluator) với các chỉ số mới
      smoke_test_failed.py:
        description: Smoke test kiểm thử và phân tích các câu hỏi bị lỗi (Q042, Q043, Q054)
      eval_retrieval.py:
        description: Script đánh giá toàn bộ retrieval cho 60 câu hỏi với các metrics Precision, Recall, F1, P@k, MRR, MAP, nDCG, Context Relevance, Latency. Output lưu tại data/processed/retrieval_eval_results.json và retrieval_eval_summary.json
  .env:
    description: File môi trường cấu hình API Keys và URLs
  .gitignore:
    description: File cấu hình các thư mục và tập tin loại trừ khỏi Git
  requirements.txt:
    description: Danh sách thư viện Python phụ thuộc của dự án
  project-structure.yaml:
    description: File mô tả cấu trúc thư mục của dự án
  run.txt:
    description: Tập tin hướng dẫn các câu lệnh CLI chạy pipeline và smoke tests của dự án
  README.md:
    description: Tài liệu hướng dẫn sử dụng và giới thiệu tổng quan hệ thống RAG Report


