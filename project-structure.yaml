# Project Structure for RAG Report System
project_name: RAG_Report
version: 1.0.0
description: RAG-based financial report generation system using FPT Cloud embedding/reranking and LangGraph.

structure:
  .agents:
    description: Agent workflows, manifests, and local coordination rules.
    children:
      manifests:
        description: Locked model, reasoning, tool-scope, and schema manifests for coding workflow.
      state:
        description: Coordinator state templates and local runtime artifacts.
      subagents:
        description: File-defined specialist prompts for Analyze, Implement, and Review roles.
      rules:
        description: Repository development and debugging rules.
      workflows:
        description: Workflow playbooks for agent execution.
  data:
    description: Input data, processed artifacts, and generated reports.
    children:
      A32:
        description: Financial source material for Company 32 across fiscal years.
        children:
          2017:
            description: Audited financial report for 2017.
          2018:
            description: Audited financial report for 2018.
          2019:
            description: Audited financial report for 2019.
          2020:
            description: Audited financial report for 2020.
          2021:
            description: Audited financial report for 2021.
          2023:
            description: Audited financial report for 2023.
          2024:
            description: Audited financial report for 2024.
          2025:
            description: Audited financial report for 2025.
          question_eval.json:
            description: Evaluation question set for retrieval and grounded-answer testing.
      processed:
        description: Processed financial JSON, DuckDB outputs, and other intermediate artifacts.
      reports:
        description: Exported HTML reports and report-side assets.
        children:
          A32_Financial_Report.html:
            description: Primary v1 HTML report.
          A32_Financial_Report_v2.html:
            description: Alternate HTML report generated from the older RAG path.
          html:
            description: Generated HTML test reports (e.g. smoke_test_vnext_output.html).
  plan:
    description: Architecture notes, framework documents, and implementation plans.
    children:
      IMPLEMENTATION_SPEC_RAG_REPORT.md:
        description: Original implementation spec for the RAG report system.
      framework_nhung_con_so_co_dang_tin_khong_A32.md:
        description: Source-of-truth framework for the vNext opening section refactor.
  src:
    description: Application source code.
    children:
      rag_report:
        description: Main Python package for ingestion, retrieval, evaluation, and export.
        children:
          config:
            description: Environment settings and shared configuration.
          schemas:
            description: Pydantic schemas for core ingestion and query models.
          ingestion:
            description: OCR parsing, embedding, and vector/DB sync logic.
          query:
            description: LangGraph-based RAG query path and report generation graph.
          evaluation:
            description: Automatic evaluation for retrieval and answer quality.
          exporter:
            description: Deterministic chart export and legacy HTML report assembly.
          coding_workflow:
            description: Multi-agent coding workflow contracts, manifest loaders, and state routing helpers.
          report_vnext:
            description: Parallel vNext opening-section pipeline with evidence packs, metric provenance, chart planning, and bright HTML export.
  flows:
    description: Prefect orchestration flows.
    children:
      prefect_ingestion_flow.py:
        description: End-to-end ingestion flow for source reports.
      generate_report_flow.py:
        description: Current production report flow that queries RAG sections and exports HTML.
      generate_report_vnext_flow.py:
        description: Parallel vNext flow that generates the opening section HTML skeleton for the refactored report.
  tests:
    description: Focused smoke tests and unit tests.
    children:
      run_generate_v2.py:
        description: Script to generate the v2 report without overwriting v1 output.
      smoke_test_evaluator.py:
        description: Smoke test for evaluator components.
      smoke_test_vnext.py:
        description: Smoke test for the refactored vNext report generation pipeline.
      smoke_test_failed.py:
        description: Smoke test for previously failing evaluation questions.
      eval_retrieval.py:
        description: Retrieval evaluation script with ranking and context metrics.
      test_coding_workflow_contracts.py:
        description: Contract tests for the coding workflow schemas and state transitions.
      test_coding_workflow_manifest_guardrails.py:
        description: Guardrail tests that lock coordinator and sub-agent model/reasoning defaults.
      test_report_vnext_llm.py:
        description: Unit tests for provider/model routing and retry helper behavior in the vNext path.
      test_report_vnext_metrics.py:
        description: Unit tests for metric calculations and provenance records in the vNext path.
      test_report_vnext_exporter.py:
        description: Unit tests for the vNext HTML exporter and hover tooltip provenance.
      test_report_vnext_charts.py:
        description: Unit tests for the vNext chart generation and rendering specifications.
  .env:
    description: Local environment variables and provider configuration.
  .gitignore:
    description: Git ignore rules for data, outputs, and local runtime files.
  requirements.txt:
    description: Python dependency manifest.
  project-structure.yaml:
    description: This project-structure description file.
  run.txt:
    description: Handy CLI commands for running flows and smoke tests.
  README.md:
    description: Repository overview and usage instructions.
